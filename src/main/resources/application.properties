# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Management/Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS Configuration - Use environment variables for cloud deployment
aws.region=${AWS_REGION:us-east-1}
s3.bucket.name=${S3_BUCKET_NAME:crm-data-bucket}
s3.file.prefix=${S3_FILE_PREFIX:uploads/}
s3.pdf.prefix=${S3_PDF_PREFIX:pdfs/}

# Timezone Configuration - Standardize on UTC for cloud consistency
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
