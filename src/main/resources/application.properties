spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# AWS S3 Configuration for cloud-native file storage
# These can be overridden by environment variables
aws.s3.bucket.name=${S3_BUCKET_NAME:crm-pdf-bucket}
aws.s3.pdf.prefix=pdfs/
aws.s3.csv.prefix=csv-files/
aws.region=${AWS_REGION:us-east-1}

# Cloud-native time configuration - always use UTC
spring.jackson.time-zone=UTC
spring.thymeleaf.cache=false
